[project]
name = "molecule-mcp"
version = "2.0.0"
description = "stdio MCP server backing the aura-orchestrator skill (public or private/encrypted data-room uploads). Custody-free: it CRAFTS requests/payloads (POI, Labs GraphQL, x402 prepare/submit, S3 uploads, AES-256-GCM envelope crypto, ABI encoding, on-chain access conditions, service-token sign-in) and never holds a key, signs, or broadcasts — the caller's wallet (Privy first, or its own key) does that. V2 surface, ipnftUid."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "eth-abi>=5",
    "eth-utils>=4",
    "eth-hash[pycryptodome]>=0.5",
]

[project.scripts]
molecule-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
